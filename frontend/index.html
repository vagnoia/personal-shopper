<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Shopper AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .chat-bubble { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .typing-indicator span { animation: bounce 1.4s infinite ease-in-out both; }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        .product-card { transition: all 0.2s; }
        .product-card:hover { transform: scale(1.02); }
        .markdown-content a { color: #dc2626; text-decoration: underline; }
        .markdown-content strong { font-weight: 600; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center gap-3">
            <span class="text-2xl">🛒</span>
            <div>
                <h1 class="font-bold text-lg text-gray-900">Personal Shopper</h1>
                <p class="text-xs text-gray-500">Seu assistente de compras com IA</p>
            </div>
        </div>
    </header>

    <!-- Chat Container -->
    <main class="flex-1 overflow-y-auto pb-32">
        <div id="chat" class="max-w-3xl mx-auto px-4 py-6 space-y-4">
            <!-- Welcome message -->
            <div class="chat-bubble flex gap-3">
                <div class="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center flex-shrink-0">
                    🛒
                </div>
                <div class="bg-white rounded-2xl rounded-tl-md px-4 py-3 shadow-sm border border-gray-100 max-w-[85%]">
                    <p class="text-gray-700">Olá! 👋 Sou seu personal shopper. Me conta o que você está procurando e eu encontro as melhores opções pra você!</p>
                    <div class="mt-3 flex flex-wrap gap-2">
                        <button onclick="sendSuggestion('Quero um fone bluetooth bom e barato')" class="text-sm px-3 py-1.5 bg-gray-100 hover:bg-gray-200 rounded-full text-gray-700 transition">🎧 Fone bluetooth</button>
                        <button onclick="sendSuggestion('Preciso de um monitor para programar')" class="text-sm px-3 py-1.5 bg-gray-100 hover:bg-gray-200 rounded-full text-gray-700 transition">🖥️ Monitor</button>
                        <button onclick="sendSuggestion('Qual melhor notebook até 4000?')" class="text-sm px-3 py-1.5 bg-gray-100 hover:bg-gray-200 rounded-full text-gray-700 transition">💻 Notebook</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Input Area -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200">
        <div class="max-w-3xl mx-auto px-4 py-4">
            <form id="chatForm" class="flex gap-3">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="O que você está procurando?" 
                    class="flex-1 px-4 py-3 bg-gray-100 rounded-xl border-0 focus:ring-2 focus:ring-red-500 focus:bg-white transition"
                    autocomplete="off"
                >
                <button 
                    type="submit" 
                    id="sendBtn"
                    class="px-6 py-3 bg-red-500 hover:bg-red-600 text-white font-medium rounded-xl transition disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    Enviar
                </button>
            </form>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        
        let conversationHistory = [];
        let isLoading = false;

        function sendSuggestion(text) {
            messageInput.value = text;
            chatForm.dispatchEvent(new Event('submit'));
        }

        function addMessage(role, content) {
            const isUser = role === 'user';
            const bubble = document.createElement('div');
            bubble.className = `chat-bubble flex gap-3 ${isUser ? 'flex-row-reverse' : ''}`;
            
            const avatar = isUser 
                ? '<div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center flex-shrink-0">👤</div>'
                : '<div class="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center flex-shrink-0">🛒</div>';
            
            const bgClass = isUser ? 'bg-red-500 text-white' : 'bg-white border border-gray-100 shadow-sm';
            const roundedClass = isUser ? 'rounded-tr-md' : 'rounded-tl-md';
            
            // Convert markdown-like content to HTML
            let htmlContent = content
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank">$1</a>')
                .replace(/\n/g, '<br>');
            
            bubble.innerHTML = `
                ${avatar}
                <div class="${bgClass} rounded-2xl ${roundedClass} px-4 py-3 max-w-[85%] markdown-content">
                    ${htmlContent}
                </div>
            `;
            
            chatContainer.appendChild(bubble);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addTypingIndicator() {
            const bubble = document.createElement('div');
            bubble.id = 'typing';
            bubble.className = 'chat-bubble flex gap-3';
            bubble.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center flex-shrink-0">🛒</div>
                <div class="bg-white rounded-2xl rounded-tl-md px-4 py-3 shadow-sm border border-gray-100">
                    <div class="typing-indicator flex gap-1">
                        <span class="w-2 h-2 bg-gray-400 rounded-full"></span>
                        <span class="w-2 h-2 bg-gray-400 rounded-full"></span>
                        <span class="w-2 h-2 bg-gray-400 rounded-full"></span>
                    </div>
                </div>
            `;
            chatContainer.appendChild(bubble);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeTypingIndicator() {
            const typing = document.getElementById('typing');
            if (typing) typing.remove();
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const message = messageInput.value.trim();
            if (!message || isLoading) return;
            
            isLoading = true;
            sendBtn.disabled = true;
            messageInput.value = '';
            
            // Add user message
            addMessage('user', message);
            conversationHistory.push({ role: 'user', content: message });
            
            // Show typing indicator
            addTypingIndicator();
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: conversationHistory,
                        language: 'pt-BR'
                    })
                });
                
                const data = await response.json();
                
                removeTypingIndicator();
                
                if (data.response) {
                    addMessage('assistant', data.response);
                    conversationHistory.push({ role: 'assistant', content: data.response });
                } else if (data.detail) {
                    addMessage('assistant', `Desculpe, tive um problema: ${data.detail}`);
                }
            } catch (error) {
                removeTypingIndicator();
                addMessage('assistant', 'Desculpe, ocorreu um erro. Tente novamente.');
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
                messageInput.focus();
            }
        });

        // Focus input on load
        messageInput.focus();
    </script>
</body>
</html>
