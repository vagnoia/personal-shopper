<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Shopper AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        /* Pinterest-style floating images */
        .floating-img {
            position: absolute;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .floating-img:hover { transform: scale(1.03); }
        .floating-img img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Positions for floating images - left side */
        .img-l1 { left: -40px; top: 80px; width: 140px; height: 200px; }
        .img-l2 { left: 20px; top: 300px; width: 120px; height: 160px; }
        .img-l3 { left: 120px; top: 120px; width: 160px; height: 220px; }
        .img-l4 { left: 80px; top: 380px; width: 100px; height: 140px; }
        
        /* Positions for floating images - right side */
        .img-r1 { right: -40px; top: 80px; width: 140px; height: 200px; }
        .img-r2 { right: 20px; top: 300px; width: 120px; height: 160px; }
        .img-r3 { right: 120px; top: 120px; width: 160px; height: 220px; }
        .img-r4 { right: 80px; top: 380px; width: 100px; height: 140px; }
        
        @media (max-width: 1200px) {
            .floating-img { display: none; }
        }
        
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .search-input:focus { box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2); }
        .product-card { transition: transform 0.2s, box-shadow 0.2s; }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.1); }
        
        /* Carousel dots */
        .dot { transition: all 0.3s; }
        .dot.active { background-color: #10b981; width: 24px; border-radius: 12px; }
    </style>
</head>
<body class="bg-white min-h-screen">

    <!-- HOME PAGE -->
    <div id="homePage" class="min-h-screen relative">
        <!-- Header -->
        <header class="relative z-50">
            <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
                <div class="flex items-center gap-8">
                    <a href="/" class="flex items-center gap-2">
                        <span class="text-2xl">🛒</span>
                        <span class="font-bold text-xl text-gray-900">PersonalShopper</span>
                    </a>
                    <nav class="hidden md:flex items-center gap-6 text-sm text-gray-600">
                        <a href="#" class="hover:text-gray-900">Explorar</a>
                    </nav>
                </div>
                <div class="flex items-center gap-4">
                    <nav class="hidden md:flex items-center gap-6 text-sm text-gray-600">
                        <a href="#" class="hover:text-gray-900">Sobre</a>
                        <a href="#" class="hover:text-gray-900">Empresas</a>
                    </nav>
                    <button class="text-sm bg-red-500 text-white px-4 py-2 rounded-full hover:bg-red-600 font-medium">Entrar</button>
                    <button class="text-sm text-gray-700 hover:text-gray-900 px-3 py-2">Criar conta</button>
                </div>
            </div>
        </header>

        <!-- Floating Images - Left Side -->
        <div class="floating-img img-l1 cursor-pointer" onclick="search('fone bluetooth premium')">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300" alt="">
        </div>
        <div class="floating-img img-l2 cursor-pointer" onclick="search('decoração casa')">
            <img src="https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=300" alt="">
        </div>
        <div class="floating-img img-l3 cursor-pointer" onclick="search('mochila notebook')">
            <img src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=300" alt="">
        </div>
        <div class="floating-img img-l4 cursor-pointer" onclick="search('tênis esportivo')">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300" alt="">
        </div>

        <!-- Floating Images - Right Side -->
        <div class="floating-img img-r1 cursor-pointer" onclick="search('smartwatch')">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300" alt="">
        </div>
        <div class="floating-img img-r2 cursor-pointer" onclick="search('óculos de sol')">
            <img src="https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=300" alt="">
        </div>
        <div class="floating-img img-r3 cursor-pointer" onclick="search('cadeira gamer')">
            <img src="https://images.unsplash.com/photo-1590736969955-71cc94901144?w=300" alt="">
        </div>
        <div class="floating-img img-r4 cursor-pointer" onclick="search('perfume importado')">
            <img src="https://images.unsplash.com/photo-1585386959984-a4155224a1ad?w=300" alt="">
        </div>

        <!-- Hero Section -->
        <section class="relative z-10 pt-20 pb-12 px-4">
            <div class="max-w-3xl mx-auto text-center">
                <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold text-gray-900 mb-2">Encontre sua próxima</h1>
                <h1 id="heroSubtitle" class="text-4xl md:text-5xl lg:text-6xl font-bold text-emerald-500 mb-8">melhor compra com IA</h1>
                
                <!-- Carousel Dots -->
                <div class="flex justify-center gap-2 mb-10">
                    <span class="dot w-2 h-2 bg-emerald-500 rounded-full active"></span>
                    <span class="dot w-2 h-2 bg-gray-300 rounded-full"></span>
                    <span class="dot w-2 h-2 bg-gray-300 rounded-full"></span>
                    <span class="dot w-2 h-2 bg-gray-300 rounded-full"></span>
                </div>
                
                <!-- Search Bar -->
                <form id="searchForm" class="relative max-w-xl mx-auto mb-8">
                    <input 
                        type="text" 
                        id="searchInput"
                        placeholder="O que você está procurando?"
                        class="search-input w-full px-6 py-4 pr-14 text-lg border-2 border-gray-200 rounded-full focus:outline-none focus:border-red-400 bg-white shadow-sm"
                    >
                    <button type="submit" class="absolute right-2 top-1/2 -translate-y-1/2 bg-red-500 hover:bg-red-600 text-white w-11 h-11 rounded-full flex items-center justify-center transition shadow-md">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                    </button>
                </form>

                <!-- Popular Searches -->
                <div class="flex flex-wrap justify-center gap-2">
                    <button onclick="search('Notebook gamer barato')" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-full text-sm text-gray-700 transition">Notebook gamer barato</button>
                    <button onclick="search('Fone bluetooth até 500')" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-full text-sm text-gray-700 transition">Fone bluetooth até 500</button>
                    <button onclick="search('Smartwatch com GPS')" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-full text-sm text-gray-700 transition">Smartwatch com GPS</button>
                    <button onclick="search('Cadeira ergonômica')" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-full text-sm text-gray-700 transition">Cadeira ergonômica</button>
                </div>
            </div>
        </section>

        <!-- Scroll indicator -->
        <div class="absolute bottom-8 left-1/2 -translate-x-1/2 animate-bounce">
            <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/>
            </svg>
        </div>
    </div>

    <!-- RESULTS PAGE -->
    <div id="resultsPage" class="hidden min-h-screen bg-gray-50">
        <!-- Header -->
        <header class="bg-white border-b border-gray-100 sticky top-0 z-50">
            <div class="max-w-4xl mx-auto px-4 py-3 flex items-center gap-4">
                <button onclick="goHome()" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                </button>
                <a href="/" onclick="goHome(); return false;" class="flex items-center gap-2">
                    <span class="text-xl">🛒</span>
                    <span class="font-bold text-lg text-gray-900">PersonalShopper</span>
                </a>
                <div class="flex-1"></div>
                <button class="text-gray-400 hover:text-gray-600" title="Histórico">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Results Content -->
        <main class="max-w-4xl mx-auto px-4 py-8">
            <!-- Query Title -->
            <h1 id="queryTitle" class="text-2xl md:text-3xl font-bold text-gray-900 text-center mb-2"></h1>
            <p class="text-center text-sm text-gray-400 mb-8">
                <span class="inline-flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    BUSCA REALIZADA
                </span>
            </p>

            <!-- Loading State -->
            <div id="loadingState" class="text-center py-12">
                <div class="inline-flex items-center gap-3 text-gray-500">
                    <svg class="animate-spin w-6 h-6" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>Buscando os melhores produtos...</span>
                </div>
            </div>

            <!-- Results Content -->
            <div id="resultsContent" class="hidden fade-in">
                <!-- Summary -->
                <div id="summaryText" class="text-gray-700 leading-relaxed mb-8 text-center max-w-2xl mx-auto"></div>

                <!-- Product Cards -->
                <div id="productCards" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8"></div>

                <!-- Follow-up Suggestions -->
                <div id="suggestions" class="flex flex-wrap justify-center gap-2 mb-8"></div>
            </div>

            <!-- Follow-up Input -->
            <div id="followUpSection" class="hidden border-t border-gray-200 pt-6 mt-8">
                <form id="followUpForm" class="relative max-w-2xl mx-auto">
                    <input 
                        type="text" 
                        id="followUpInput"
                        placeholder="Pergunte mais sobre os modelos..."
                        class="w-full px-5 py-3 pr-14 border border-gray-200 rounded-full focus:outline-none focus:border-red-400 bg-white"
                    >
                    <button type="submit" class="absolute right-2 top-1/2 -translate-y-1/2 bg-red-500 hover:bg-red-600 text-white w-9 h-9 rounded-full flex items-center justify-center transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                        </svg>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <script>
        // Hero subtitle rotation
        const subtitles = [
            { text: 'melhor compra com IA', color: 'text-emerald-500' },
            { text: 'presente perfeito', color: 'text-pink-500' },
            { text: 'upgrade de setup', color: 'text-blue-500' },
            { text: 'estilo único', color: 'text-purple-500' }
        ];
        let currentSubtitle = 0;
        const heroSubtitle = document.getElementById('heroSubtitle');
        const dots = document.querySelectorAll('.dot');

        setInterval(() => {
            currentSubtitle = (currentSubtitle + 1) % subtitles.length;
            const sub = subtitles[currentSubtitle];
            heroSubtitle.style.opacity = 0;
            setTimeout(() => {
                heroSubtitle.textContent = sub.text;
                heroSubtitle.className = `text-4xl md:text-5xl lg:text-6xl font-bold ${sub.color} mb-8`;
                heroSubtitle.style.opacity = 1;
                dots.forEach((d, i) => d.classList.toggle('active', i === currentSubtitle));
            }, 300);
        }, 3000);

        // State
        let conversationHistory = [];
        let currentQuery = '';

        // Search form
        document.getElementById('searchForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            if (query) search(query);
        });

        // Follow-up form
        document.getElementById('followUpForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const query = document.getElementById('followUpInput').value.trim();
            if (query) sendFollowUp(query);
        });

        function search(query) {
            currentQuery = query;
            conversationHistory = [{ role: 'user', content: query }];
            
            document.getElementById('homePage').classList.add('hidden');
            document.getElementById('resultsPage').classList.remove('hidden');
            document.getElementById('queryTitle').textContent = query;
            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('resultsContent').classList.add('hidden');
            document.getElementById('followUpSection').classList.add('hidden');

            fetchResults();
        }

        function goHome() {
            document.getElementById('resultsPage').classList.add('hidden');
            document.getElementById('homePage').classList.remove('hidden');
            document.getElementById('searchInput').value = '';
            conversationHistory = [];
        }

        async function fetchResults() {
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: conversationHistory, language: 'pt-BR' })
                });
                
                const data = await res.json();
                
                if (data.response) {
                    conversationHistory.push({ role: 'assistant', content: data.response });
                    displayResults(data.response, data.products);
                } else {
                    displayError(data.detail || 'Erro ao buscar produtos');
                }
            } catch (err) {
                displayError('Erro de conexão. Tente novamente.');
            }
        }

        function displayResults(text, products) {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('resultsContent').classList.remove('hidden');
            document.getElementById('followUpSection').classList.remove('hidden');

            let html = text
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
            document.getElementById('summaryText').innerHTML = html;

            const cardsContainer = document.getElementById('productCards');
            cardsContainer.innerHTML = '';
            
            if (products && products.length > 0) {
                products.forEach((p, i) => {
                    const link = p.buy_links?.[0];
                    const price = p.price?.match?.(/R\$[\d.,\s]+/)?.[0] || p.price || 'Ver preço';
                    const hasImg = p.image_url && !p.image_url.includes('logo');
                    
                    const card = document.createElement('div');
                    card.className = 'product-card bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-sm';
                    card.innerHTML = `
                        <div class="relative">
                            ${i === 0 ? '<span class="absolute top-3 left-3 bg-red-500 text-white text-xs px-3 py-1 rounded-full font-medium">⭐ MELHOR ESCOLHA</span>' : ''}
                            <div class="h-48 bg-gray-50 flex items-center justify-center p-4">
                                ${hasImg 
                                    ? `<img src="${p.image_url}" alt="${p.name}" class="max-h-full max-w-full object-contain" onerror="this.outerHTML='<span class=\\'text-5xl\\'>${getEmoji(p.name)}</span>'">`
                                    : `<span class="text-5xl">${getEmoji(p.name)}</span>`}
                            </div>
                        </div>
                        <div class="p-4">
                            <p class="text-xs text-gray-400 uppercase tracking-wide mb-1 flex items-center gap-1">
                                <span class="w-1.5 h-1.5 bg-green-500 rounded-full"></span>
                                ${link?.store || 'Loja'}
                            </p>
                            <h3 class="font-semibold text-gray-900 mb-2 line-clamp-2">${p.name}</h3>
                            <div class="flex items-center justify-between">
                                <span class="text-xl font-bold text-gray-900">${price}</span>
                                <button class="text-gray-300 hover:text-red-500 transition">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                                    </svg>
                                </button>
                            </div>
                            ${link ? `<a href="${link.url}" target="_blank" class="mt-3 block w-full bg-gray-900 hover:bg-gray-800 text-white text-center py-2.5 rounded-xl text-sm font-medium transition">Ver na ${link.store}</a>` : ''}
                        </div>
                    `;
                    cardsContainer.appendChild(card);
                });
            }

            const suggestionsContainer = document.getElementById('suggestions');
            const suggestions = generateSuggestions(currentQuery, products);
            suggestionsContainer.innerHTML = suggestions.map(s => 
                `<button onclick="sendFollowUp('${s}')" class="px-4 py-2 bg-white border border-gray-200 rounded-full text-sm text-gray-600 hover:border-gray-300 hover:bg-gray-50 transition">${s}</button>`
            ).join('');
        }

        function displayError(message) {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('resultsContent').classList.remove('hidden');
            document.getElementById('summaryText').innerHTML = `<p class="text-red-500">${message}</p>`;
            document.getElementById('productCards').innerHTML = '';
            document.getElementById('suggestions').innerHTML = '';
        }

        async function sendFollowUp(query) {
            conversationHistory.push({ role: 'user', content: query });
            document.getElementById('followUpInput').value = '';
            document.getElementById('queryTitle').textContent = query;
            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('resultsContent').classList.add('hidden');
            
            await fetchResults();
        }

        function getEmoji(name) {
            const n = name.toLowerCase();
            if (n.includes('fone') || n.includes('buds') || n.includes('headphone') || n.includes('airpod')) return '🎧';
            if (n.includes('monitor')) return '🖥️';
            if (n.includes('notebook') || n.includes('laptop') || n.includes('macbook')) return '💻';
            if (n.includes('teclado')) return '⌨️';
            if (n.includes('mouse')) return '🖱️';
            if (n.includes('cadeira')) return '🪑';
            if (n.includes('phone') || n.includes('celular') || n.includes('iphone') || n.includes('galaxy')) return '📱';
            if (n.includes('tênis') || n.includes('tenis')) return '👟';
            if (n.includes('smartwatch') || n.includes('relógio')) return '⌚';
            return '📦';
        }

        function generateSuggestions(query, products) {
            const q = query.toLowerCase();
            if (q.includes('fone')) {
                return ['Qual tem melhor cancelamento de ruído?', 'Alguma opção da Sony?', 'Qual dura mais a bateria?'];
            }
            if (q.includes('notebook')) {
                return ['Qual é melhor pra jogos?', 'Algum com SSD de 512GB?', 'Qual tem melhor tela?'];
            }
            if (q.includes('cadeira')) {
                return ['Qual é mais confortável?', 'Alguma com apoio lombar?', 'Qual aguenta mais peso?'];
            }
            return ['Qual tem a melhor avaliação?', 'Alguma opção mais barata?', 'Qual você recomenda?'];
        }
    </script>
</body>
</html>
