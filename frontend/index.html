<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Shopper AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .chat-bubble { animation: bubbleIn 0.3s ease-out; }
        @keyframes bubbleIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .typing span { animation: bounce 1.4s infinite ease-in-out; }
        .typing span:nth-child(2) { animation-delay: 0.16s; }
        .typing span:nth-child(3) { animation-delay: 0.32s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }
        .product-card { transition: all 0.2s; }
        .product-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .markdown a { color: #dc2626; text-decoration: underline; }
        .markdown strong { font-weight: 600; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white border-b border-gray-100 sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center gap-3">
            <a href="/" onclick="location.reload()" class="flex items-center gap-2">
                <span class="text-2xl">🛒</span>
                <div>
                    <h1 class="font-bold text-lg text-gray-900 leading-tight">Personal Shopper</h1>
                    <p class="text-xs text-gray-500">Seu assistente de compras</p>
                </div>
            </a>
        </div>
    </header>

    <!-- Chat Container -->
    <main id="chatContainer" class="flex-1 overflow-y-auto">
        <div class="max-w-3xl mx-auto px-4 py-6">
            <!-- Welcome -->
            <div id="welcome" class="text-center py-12">
                <div class="text-6xl mb-4">🛒</div>
                <h2 class="text-2xl font-bold text-gray-900 mb-2">Olá! Sou seu personal shopper</h2>
                <p class="text-gray-500 mb-8 max-w-md mx-auto">Me conta o que você está procurando e eu ajudo a encontrar as melhores opções!</p>
                
                <div class="flex flex-wrap justify-center gap-2 mb-8">
                    <button onclick="send('Quero um fone bluetooth bom, o que você recomenda?')" class="px-4 py-2 bg-white hover:bg-gray-50 rounded-full text-sm text-gray-700 border border-gray-200 shadow-sm transition">🎧 Fone bluetooth</button>
                    <button onclick="send('Preciso de um monitor pra programar, me ajuda?')" class="px-4 py-2 bg-white hover:bg-gray-50 rounded-full text-sm text-gray-700 border border-gray-200 shadow-sm transition">🖥️ Monitor</button>
                    <button onclick="send('Qual notebook você indica até 4000 reais?')" class="px-4 py-2 bg-white hover:bg-gray-50 rounded-full text-sm text-gray-700 border border-gray-200 shadow-sm transition">💻 Notebook</button>
                </div>
            </div>

            <!-- Messages -->
            <div id="messages" class="space-y-4 pb-4"></div>
        </div>
    </main>

    <!-- Input -->
    <div class="bg-white border-t border-gray-200 p-4 sticky bottom-0">
        <form id="chatForm" class="max-w-3xl mx-auto flex gap-3">
            <input 
                type="text" 
                id="input" 
                placeholder="Digite sua mensagem..." 
                class="flex-1 px-4 py-3 bg-gray-100 rounded-xl focus:bg-white focus:ring-2 focus:ring-red-500 transition outline-none"
                autocomplete="off"
            >
            <button type="submit" id="sendBtn" class="bg-red-500 hover:bg-red-600 disabled:bg-gray-300 text-white px-6 py-3 rounded-xl font-medium transition">
                Enviar
            </button>
        </form>
    </div>

    <script>
        const messagesEl = document.getElementById('messages');
        const welcomeEl = document.getElementById('welcome');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const chatForm = document.getElementById('chatForm');
        
        let history = [];
        let isLoading = false;

        function scrollToBottom() {
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function hideWelcome() {
            welcomeEl.classList.add('hidden');
        }

        function addMessage(role, content, products = null) {
            hideWelcome();
            const isUser = role === 'user';
            
            const bubble = document.createElement('div');
            bubble.className = `chat-bubble flex ${isUser ? 'justify-end' : 'gap-3'}`;
            
            // Parse markdown-like content
            let html = content
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank">$1</a>')
                .replace(/\n/g, '<br>');
            
            if (isUser) {
                bubble.innerHTML = `<div class="bg-red-500 text-white px-4 py-3 rounded-2xl rounded-br-sm max-w-[85%]">${html}</div>`;
            } else {
                let productsHtml = '';
                if (products && products.length > 0) {
                    productsHtml = renderProducts(products);
                }
                
                bubble.innerHTML = `
                    <div class="w-9 h-9 rounded-full bg-red-100 flex items-center justify-center flex-shrink-0 text-lg">🛒</div>
                    <div class="flex-1">
                        <div class="bg-white border border-gray-100 shadow-sm px-4 py-3 rounded-2xl rounded-tl-sm markdown">${html}</div>
                        ${productsHtml}
                    </div>
                `;
            }
            
            messagesEl.appendChild(bubble);
            scrollToBottom();
        }

        function addTyping() {
            hideWelcome();
            const bubble = document.createElement('div');
            bubble.id = 'typing';
            bubble.className = 'chat-bubble flex gap-3';
            bubble.innerHTML = `
                <div class="w-9 h-9 rounded-full bg-red-100 flex items-center justify-center flex-shrink-0 text-lg">🛒</div>
                <div class="bg-white border border-gray-100 shadow-sm px-4 py-4 rounded-2xl rounded-tl-sm">
                    <div class="typing flex gap-1">
                        <span class="w-2 h-2 bg-gray-400 rounded-full"></span>
                        <span class="w-2 h-2 bg-gray-400 rounded-full"></span>
                        <span class="w-2 h-2 bg-gray-400 rounded-full"></span>
                    </div>
                </div>
            `;
            messagesEl.appendChild(bubble);
            scrollToBottom();
        }

        function removeTyping() {
            document.getElementById('typing')?.remove();
        }

        function getEmoji(name) {
            const n = name.toLowerCase();
            if (n.includes('fone') || n.includes('buds') || n.includes('headphone')) return '🎧';
            if (n.includes('monitor')) return '🖥️';
            if (n.includes('notebook') || n.includes('laptop')) return '💻';
            if (n.includes('teclado')) return '⌨️';
            if (n.includes('mouse')) return '🖱️';
            if (n.includes('cadeira')) return '🪑';
            if (n.includes('phone') || n.includes('celular')) return '📱';
            return '📦';
        }

        function renderProducts(products) {
            const colors = ['bg-blue-50', 'bg-pink-50', 'bg-purple-50', 'bg-green-50'];
            return `
                <div class="grid grid-cols-2 gap-2 mt-3">
                    ${products.slice(0, 4).map((p, i) => {
                        const link = p.buy_links?.[0];
                        const review = p.review_videos?.[0];
                        const price = p.price?.match?.(/R\$[\d.,\s]+/)?.[0] || p.price || p.price_range || '';
                        const hasImg = p.image_url && !p.image_url.includes('logo');
                        return `
                        <div class="product-card bg-white rounded-xl border border-gray-100 overflow-hidden shadow-sm">
                            <div class="${colors[i % 4]} h-24 flex items-center justify-center relative">
                                ${i === 0 ? '<span class="absolute top-1 left-1 bg-green-500 text-white text-[10px] px-1.5 py-0.5 rounded-full">⭐ Top</span>' : ''}
                                ${hasImg 
                                    ? `<img src="${p.image_url}" class="max-h-20 object-contain" onerror="this.outerHTML='<span class=\\'text-3xl\\'>${getEmoji(p.name)}</span>'">`
                                    : `<span class="text-3xl">${getEmoji(p.name)}</span>`}
                            </div>
                            <div class="p-2">
                                <p class="text-[10px] text-gray-500">${link?.store || ''}</p>
                                <h4 class="text-xs font-semibold text-gray-900 line-clamp-2 leading-tight">${p.name}</h4>
                                <p class="text-sm font-bold text-gray-900 mt-1">${price}</p>
                                <div class="flex gap-1 mt-2">
                                    ${link ? `<a href="${link.url}" target="_blank" class="flex-1 bg-red-500 hover:bg-red-600 text-white text-center py-1.5 rounded-lg text-xs font-medium">Comprar</a>` : ''}
                                    ${review ? `<a href="${review.url}" target="_blank" class="bg-gray-100 hover:bg-gray-200 py-1.5 px-2 rounded-lg text-xs">▶️</a>` : ''}
                                </div>
                            </div>
                        </div>`;
                    }).join('')}
                </div>
            `;
        }

        async function send(text) {
            if (!text?.trim() || isLoading) return;
            
            isLoading = true;
            sendBtn.disabled = true;
            input.value = '';
            
            addMessage('user', text);
            history.push({ role: 'user', content: text });
            
            addTyping();

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: history, language: 'pt-BR' })
                });
                
                removeTyping();
                
                const data = await res.json();
                
                if (data.response) {
                    addMessage('assistant', data.response, data.products);
                    history.push({ role: 'assistant', content: data.response });
                } else if (data.detail) {
                    addMessage('assistant', `Ops, tive um problema: ${data.detail}`);
                } else {
                    addMessage('assistant', 'Desculpa, não entendi. Pode reformular?');
                }
            } catch (err) {
                removeTyping();
                addMessage('assistant', 'Ops, erro de conexão. Tenta de novo?');
            }
            
            isLoading = false;
            sendBtn.disabled = false;
            input.focus();
        }

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            send(input.value);
        });

        input.focus();
    </script>
</body>
</html>
