<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Shopper AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        /* Pinterest-style floating images */
        .floating-img {
            position: absolute;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .floating-img:hover { transform: scale(1.03); }
        .floating-img img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Positions for floating images - left side */
        .img-l1 { left: -30px; top: 60px; width: 120px; height: 180px; }
        .img-l2 { left: 40px; top: 260px; width: 140px; height: 180px; }
        .img-l3 { left: 140px; top: 80px; width: 130px; height: 160px; }
        .img-l4 { left: 10px; top: 460px; width: 110px; height: 140px; }
        .img-l5 { left: 160px; top: 420px; width: 100px; height: 130px; }
        
        /* Positions for floating images - right side */
        .img-r1 { right: -30px; top: 60px; width: 120px; height: 180px; }
        .img-r2 { right: 40px; top: 260px; width: 140px; height: 180px; }
        .img-r3 { right: 140px; top: 80px; width: 130px; height: 160px; }
        .img-r4 { right: 10px; top: 460px; width: 110px; height: 140px; }
        .img-r5 { right: 160px; top: 420px; width: 100px; height: 130px; }
        
        @media (max-width: 1200px) {
            .floating-img { display: none; }
        }
        
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .search-input:focus { box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2); }
        .product-card { transition: transform 0.2s, box-shadow 0.2s; }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.1); }
        
        /* Carousel dots */
        .dot { transition: all 0.3s; }
        .dot.active { background-color: #10b981; width: 24px; border-radius: 12px; }
        
        /* Streaming cursor */
        .streaming-cursor { color: #ef4444; font-weight: bold; }
    </style>
</head>
<body class="bg-white min-h-screen">

    <!-- HOME PAGE -->
    <div id="homePage" class="min-h-screen relative">
        <!-- Header -->
        <header class="relative z-50">
            <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
                <a href="/" class="flex items-center gap-2">
                    <span class="text-2xl">🛒</span>
                    <span class="font-bold text-xl text-gray-900">PersonalShopper</span>
                </a>
                <div class="flex items-center gap-3">
                    <button class="text-sm bg-red-500 text-white px-4 py-2 rounded-full hover:bg-red-600 font-medium">Entrar</button>
                    <button class="text-sm text-gray-700 hover:text-gray-900 px-3 py-2">Criar conta</button>
                </div>
            </div>
        </header>

        <!-- Floating Images - Left Side -->
        <div class="floating-img img-l1 cursor-pointer" onclick="search('fone bluetooth premium')">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300" alt="">
        </div>
        <div class="floating-img img-l2 cursor-pointer" onclick="search('tênis esportivo')">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300" alt="">
        </div>
        <div class="floating-img img-l3 cursor-pointer" onclick="search('mochila notebook')">
            <img src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=300" alt="">
        </div>
        <div class="floating-img img-l4 cursor-pointer" onclick="search('mouse gamer')">
            <img src="https://images.unsplash.com/photo-1527814050087-3793815479db?w=300" alt="">
        </div>
        <div class="floating-img img-l5 cursor-pointer" onclick="search('monitor ultrawide')">
            <img src="https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?w=300" alt="">
        </div>

        <!-- Floating Images - Right Side -->
        <div class="floating-img img-r1 cursor-pointer" onclick="search('smartwatch')">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300" alt="">
        </div>
        <div class="floating-img img-r2 cursor-pointer" onclick="search('perfume importado')">
            <img src="https://images.unsplash.com/photo-1585386959984-a4155224a1ad?w=300" alt="">
        </div>
        <div class="floating-img img-r3 cursor-pointer" onclick="search('óculos de sol')">
            <img src="https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=300" alt="">
        </div>
        <div class="floating-img img-r4 cursor-pointer" onclick="search('teclado mecânico')">
            <img src="https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=300" alt="">
        </div>
        <div class="floating-img img-r5 cursor-pointer" onclick="search('cadeira gamer')">
            <img src="https://images.unsplash.com/photo-1590736969955-71cc94901144?w=300" alt="">
        </div>

        <!-- Hero Section -->
        <section class="relative z-10 pt-20 pb-12 px-4">
            <div class="max-w-3xl mx-auto text-center">
                <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold text-gray-900 mb-2">Encontre sua próxima</h1>
                <h1 id="heroSubtitle" class="text-4xl md:text-5xl lg:text-6xl font-bold text-emerald-500 mb-8">melhor compra com IA</h1>
                
                <!-- Carousel Dots -->
                <div class="flex justify-center gap-2 mb-10">
                    <span class="dot w-2 h-2 bg-emerald-500 rounded-full active"></span>
                    <span class="dot w-2 h-2 bg-gray-300 rounded-full"></span>
                    <span class="dot w-2 h-2 bg-gray-300 rounded-full"></span>
                    <span class="dot w-2 h-2 bg-gray-300 rounded-full"></span>
                </div>
                
                <!-- Search Bar -->
                <form id="searchForm" class="relative max-w-xl mx-auto mb-8">
                    <input 
                        type="text" 
                        id="searchInput"
                        placeholder="fone bluetooth até 500 reais"
                        class="search-input w-full px-6 py-4 pr-14 text-lg border-2 border-gray-200 rounded-full focus:outline-none focus:border-red-400 bg-white shadow-sm"
                    >
                    <button type="submit" class="absolute right-2 top-1/2 -translate-y-1/2 bg-red-500 hover:bg-red-600 text-white w-11 h-11 rounded-full flex items-center justify-center transition shadow-md">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                    </button>
                </form>

                <!-- Popular Searches -->
                <div class="flex flex-wrap justify-center gap-2">
                    <button onclick="search('Notebook gamer barato')" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-full text-sm text-gray-700 transition">Notebook gamer barato</button>
                    <button onclick="search('Fone bluetooth até 500')" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-full text-sm text-gray-700 transition">Fone bluetooth até 500</button>
                    <button onclick="search('Smartwatch com GPS')" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-full text-sm text-gray-700 transition">Smartwatch com GPS</button>
                    <button onclick="search('Cadeira ergonômica')" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-full text-sm text-gray-700 transition">Cadeira ergonômica</button>
                </div>
            </div>
        </section>

    </div>

    <!-- CHAT PAGE -->
    <div id="resultsPage" class="hidden min-h-screen bg-white flex flex-col">
        <!-- Header -->
        <header class="bg-white/80 backdrop-blur-sm border-b border-gray-100 sticky top-0 z-50">
            <div class="max-w-3xl mx-auto px-4 py-3 flex items-center gap-4">
                <button onclick="goHome()" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                </button>
                <a href="/" onclick="goHome(); return false;" class="flex items-center gap-2">
                    <span class="text-xl">🛒</span>
                    <span class="font-bold text-lg text-gray-900">PersonalShopper</span>
                </a>
            </div>
        </header>

        <!-- Chat Title -->
        <div class="text-center py-6">
            <h1 id="queryTitle" class="text-xl md:text-2xl font-bold text-gray-900"></h1>
        </div>

        <!-- Chat Messages -->
        <main id="chatMessages" class="flex-1 overflow-y-auto px-4 py-6 pb-32">
            <div class="max-w-3xl mx-auto space-y-6" id="messagesContainer">
                <!-- Messages will be added here -->
            </div>
        </main>

        <!-- Floating Input with gradient fade -->
        <div class="fixed bottom-0 left-0 right-0 z-40 pointer-events-none">
            <div class="h-8 bg-gradient-to-t from-white to-transparent"></div>
            <div class="bg-white px-4 pb-6 pt-2 pointer-events-auto">
                <form id="followUpForm" class="relative max-w-2xl mx-auto">
                    <input 
                        type="text" 
                        id="followUpInput"
                        placeholder="Continue a conversa..."
                        class="w-full px-5 py-3 pr-14 border border-gray-200 rounded-full focus:outline-none focus:border-red-400 bg-white shadow-lg"
                    >
                    <button type="submit" class="absolute right-2 top-1/2 -translate-y-1/2 bg-red-500 hover:bg-red-600 text-white w-9 h-9 rounded-full flex items-center justify-center transition shadow-md">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                        </svg>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Hero subtitle rotation
        const subtitles = [
            { text: 'melhor compra com IA', color: 'text-emerald-500' },
            { text: 'presente perfeito', color: 'text-pink-500' },
            { text: 'upgrade de setup', color: 'text-blue-500' },
            { text: 'estilo único', color: 'text-purple-500' }
        ];
        let currentSubtitle = 0;
        const heroSubtitle = document.getElementById('heroSubtitle');
        const dots = document.querySelectorAll('.dot');

        setInterval(() => {
            currentSubtitle = (currentSubtitle + 1) % subtitles.length;
            const sub = subtitles[currentSubtitle];
            heroSubtitle.style.opacity = 0;
            setTimeout(() => {
                heroSubtitle.textContent = sub.text;
                heroSubtitle.className = `text-4xl md:text-5xl lg:text-6xl font-bold ${sub.color} mb-8`;
                heroSubtitle.style.opacity = 1;
                dots.forEach((d, i) => d.classList.toggle('active', i === currentSubtitle));
            }, 300);
        }, 3000);

        // State
        let conversationHistory = [];
        let currentQuery = '';
        let currentAssistantBubble = null;
        let currentProductsContainer = null;

        // Search form
        document.getElementById('searchForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            if (query) search(query);
        });

        // Follow-up form
        document.getElementById('followUpForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const query = document.getElementById('followUpInput').value.trim();
            if (query) sendMessage(query);
        });

        function search(query) {
            currentQuery = query;
            conversationHistory = [];
            document.getElementById('messagesContainer').innerHTML = '';
            
            document.getElementById('homePage').classList.add('hidden');
            document.getElementById('resultsPage').classList.remove('hidden');
            document.getElementById('queryTitle').textContent = query;

            sendMessage(query);
        }

        function goHome() {
            document.getElementById('resultsPage').classList.add('hidden');
            document.getElementById('homePage').classList.remove('hidden');
            document.getElementById('searchInput').value = '';
            document.getElementById('messagesContainer').innerHTML = '';
            conversationHistory = [];
        }

        function addUserBubble(text) {
            const container = document.getElementById('messagesContainer');
            const bubble = document.createElement('div');
            bubble.className = 'flex justify-end';
            bubble.innerHTML = `
                <div class="bg-red-500 text-white px-4 py-3 rounded-2xl max-w-[80%]">
                    ${escapeHtml(text)}
                </div>
            `;
            container.appendChild(bubble);
            scrollToBottom();
        }

        function addAssistantBubble() {
            const container = document.getElementById('messagesContainer');
            const wrapper = document.createElement('div');
            wrapper.className = 'space-y-3';
            
            const bubble = document.createElement('div');
            bubble.className = 'flex';
            bubble.innerHTML = `
                <div class="flex-1">
                    <div class="text-gray-700 leading-relaxed" id="currentText"></div>
                </div>
            `;
            wrapper.appendChild(bubble);
            
            const productsDiv = document.createElement('div');
            productsDiv.className = 'grid grid-cols-1 md:grid-cols-2 gap-3 mt-4';
            productsDiv.id = 'currentProducts';
            wrapper.appendChild(productsDiv);
            
            const suggestionsDiv = document.createElement('div');
            suggestionsDiv.className = 'flex flex-wrap gap-2 mt-3';
            suggestionsDiv.id = 'currentSuggestions';
            wrapper.appendChild(suggestionsDiv);
            
            container.appendChild(wrapper);
            
            currentAssistantBubble = bubble.querySelector('#currentText');
            currentProductsContainer = productsDiv;
            
            scrollToBottom();
            return { textEl: currentAssistantBubble, productsEl: productsDiv, suggestionsEl: suggestionsDiv };
        }

        async function sendMessage(text) {
            conversationHistory.push({ role: 'user', content: text });
            document.getElementById('followUpInput').value = '';
            
            addUserBubble(text);
            const { textEl, productsEl, suggestionsEl } = addAssistantBubble();
            
            let collectedText = '';
            let products = null;
            
            textEl.innerHTML = '<span class="streaming-cursor animate-pulse">|</span>';
            
            try {
                const res = await fetch('/api/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: conversationHistory, language: 'pt-BR' })
                });
                
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                
                                if (data.type === 'text') {
                                    collectedText += data.content;
                                    textEl.innerHTML = formatText(collectedText) + '<span class="streaming-cursor animate-pulse">|</span>';
                                    scrollToBottom();
                                } else if (data.type === 'searching') {
                                    textEl.innerHTML = formatText(collectedText) + 
                                        '<div class="mt-3 flex items-center gap-2 text-gray-400 text-sm"><svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg> Pesquisando produtos...</div>';
                                    scrollToBottom();
                                } else if (data.type === 'products') {
                                    products = data.content;
                                } else if (data.type === 'done') {
                                    conversationHistory.push({ role: 'assistant', content: collectedText });
                                    textEl.innerHTML = formatText(collectedText);
                                    if (products && products.length > 0) {
                                        renderProducts(productsEl, products);
                                    }
                                    renderSuggestions(suggestionsEl);
                                    scrollToBottom();
                                } else if (data.type === 'error') {
                                    textEl.innerHTML = `<span class="text-red-500">${data.content}</span>`;
                                }
                            } catch (e) {}
                        }
                    }
                }
            } catch (err) {
                textEl.innerHTML = '<span class="text-red-500">Erro de conexão. Tente novamente.</span>';
            }
        }

        function renderProducts(container, products) {
            container.innerHTML = products.slice(0, 4).map((p, i) => {
                const link = p.buy_links?.[0];
                const price = p.price?.match?.(/R\$[\d.,\s]+/)?.[0] || p.price || 'Ver preço';
                const hasImg = p.image_url && !p.image_url.includes('logo');
                
                return `
                    <div class="product-card bg-white rounded-xl overflow-hidden border border-gray-100 shadow-sm">
                        <div class="relative">
                            ${i === 0 ? '<span class="absolute top-2 left-2 bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-full font-medium">⭐ MELHOR</span>' : ''}
                            <div class="h-32 bg-gray-50 flex items-center justify-center p-3">
                                ${hasImg 
                                    ? `<img src="${p.image_url}" alt="${p.name}" class="max-h-full max-w-full object-contain" onerror="this.outerHTML='<span class=\\'text-4xl\\'>${getEmoji(p.name)}</span>'">`
                                    : `<span class="text-4xl">${getEmoji(p.name)}</span>`}
                            </div>
                        </div>
                        <div class="p-3">
                            <p class="text-[10px] text-gray-400 uppercase">${link?.store || ''}</p>
                            <h4 class="text-sm font-medium text-gray-900 line-clamp-2 mb-1">${p.name}</h4>
                            <p class="text-base font-bold text-gray-900">${price}</p>
                            ${link ? `<a href="${link.url}" target="_blank" class="mt-2 block w-full bg-gray-900 hover:bg-gray-800 text-white text-center py-2 rounded-lg text-xs font-medium transition">Ver na ${link.store}</a>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderSuggestions(container) {
            const suggestions = ['Qual é o melhor?', 'Tem opção mais barata?', 'Qual você recomenda?'];
            container.innerHTML = suggestions.map(s => 
                `<button onclick="sendMessage('${s}')" class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 rounded-full text-xs text-gray-600 transition">${s}</button>`
            ).join('');
        }

        function formatText(text) {
            return text
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        }

        function scrollToBottom() {
            const chat = document.getElementById('chatMessages');
            setTimeout(() => {
                chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
            }, 50);
        }

        function getEmoji(name) {
            const n = name.toLowerCase();
            if (n.includes('fone') || n.includes('buds') || n.includes('headphone') || n.includes('airpod')) return '🎧';
            if (n.includes('monitor')) return '🖥️';
            if (n.includes('notebook') || n.includes('laptop') || n.includes('macbook')) return '💻';
            if (n.includes('teclado')) return '⌨️';
            if (n.includes('mouse')) return '🖱️';
            if (n.includes('cadeira')) return '🪑';
            if (n.includes('phone') || n.includes('celular') || n.includes('iphone') || n.includes('galaxy')) return '📱';
            if (n.includes('tênis') || n.includes('tenis')) return '👟';
            if (n.includes('smartwatch') || n.includes('relógio')) return '⌚';
            return '📦';
        }
    </script>
</body>
</html>
