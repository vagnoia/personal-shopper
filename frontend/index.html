    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FF4D6D',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        /* Floating images like BuscaAI */
        .floating-img {
            position: absolute;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15);
            transition: transform 0.7s ease;
            pointer-events: none;
        }
        .floating-img img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Left side positions */
        .pos-1 { top: 15%; left: -2%; width: 140px; transform: rotate(-8deg); }
        .pos-2 { top: 10%; left: 12%; width: 120px; transform: rotate(5deg); }
        .pos-3 { top: 45%; left: -1%; width: 130px; transform: rotate(-5deg); }
        .pos-4 { top: 65%; left: 6%; width: 110px; transform: rotate(10deg); }
        
        /* Right side positions */
        .pos-5 { top: 12%; right: 10%; width: 130px; transform: rotate(-6deg); }
        .pos-6 { top: 8%; right: -3%; width: 150px; transform: rotate(12deg); }
        .pos-7 { top: 40%; right: -2%; width: 140px; transform: rotate(-10deg); }
        .pos-8 { top: 70%; right: 8%; width: 120px; transform: rotate(8deg); }
        
        @media (min-width: 1024px) {
            .pos-1 { width: 200px; left: 2%; }
            .pos-2 { width: 160px; left: 15%; }
            .pos-3 { width: 180px; left: 1%; }
            .pos-4 { width: 150px; left: 8%; }
            .pos-5 { width: 180px; right: 12%; }
            .pos-6 { width: 220px; right: 1%; }
            .pos-7 { width: 200px; right: 0%; }
            .pos-8 { width: 160px; right: 10%; }
        }
        
        @media (max-width: 1024px) {
            .floating-img { display: none; }
        }
        
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .search-input:focus { box-shadow: 0 0 0 3px rgba(255, 77, 109, 0.2); }
        .product-card { transition: transform 0.2s, box-shadow 0.2s; }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.1); }
        
        /* Carousel dots */
        .dot { transition: all 0.3s; }
        .dot.active { background-color: #10b981; width: 24px; border-radius: 12px; }
        
        /* Streaming cursor */
        .streaming-cursor { color: #FF4D6D; font-weight: bold; }
    </style>
</head>

    <script>
        // Hero subtitle rotation
        const subtitles = [
            { text: 'sua próxima compra perfeita', color: 'text-emerald-500' },
            { text: 'o presente ideal pra ele', color: 'text-pink-500' },
            { text: 'o smartphone certo pra você', color: 'text-blue-500' },
            { text: 'a melhor oferta do momento', color: 'text-purple-500' }
        ];
        let currentSubtitle = 0;
        const heroSubtitle = document.getElementById('heroSubtitle');
        const dots = document.querySelectorAll('.dot');

        setInterval(() => {
            currentSubtitle = (currentSubtitle + 1) % subtitles.length;
            const sub = subtitles[currentSubtitle];
            heroSubtitle.style.opacity = 0;
            setTimeout(() => {
                heroSubtitle.textContent = sub.text;
                heroSubtitle.className = `text-4xl md:text-5xl lg:text-6xl font-bold ${sub.color} mb-8 transition-opacity duration-300 min-h-[2.4em]`;
                heroSubtitle.style.opacity = 1;
                dots.forEach((d, i) => d.classList.toggle('active', i === currentSubtitle));
            }, 300);
        }, 3000);

        // State
        let conversationHistory = [];
        let currentQuery = '';
        let currentAssistantBubble = null;
        let currentProductsContainer = null;

        // Search form
        document.getElementById('searchForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            if (query) search(query);
        });

        // Follow-up form
        document.getElementById('followUpForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const query = document.getElementById('followUpInput').value.trim();
            if (query) sendMessage(query);
        });

        function search(query) {
            currentQuery = query;
            conversationHistory = [];
            document.getElementById('messagesContainer').innerHTML = '';
            
            document.getElementById('homePage').classList.add('hidden');
            document.getElementById('resultsPage').classList.remove('hidden');
            document.getElementById('queryTitle').textContent = query;

            sendMessage(query);
        }

        function goHome() {
            document.getElementById('resultsPage').classList.add('hidden');
            document.getElementById('homePage').classList.remove('hidden');
            document.getElementById('searchInput').value = '';
            document.getElementById('messagesContainer').innerHTML = '';
            conversationHistory = [];
        }

        function addUserBubble(text) {
            const container = document.getElementById('messagesContainer');
            const bubble = document.createElement('div');
            bubble.className = 'flex justify-end';
            bubble.innerHTML = `
                <div class="bg-primary text-white px-4 py-3 rounded-2xl max-w-[80%]">
                    ${escapeHtml(text)}
                </div>
            `;
            container.appendChild(bubble);
            scrollToBottom();
        }

        function addAssistantBubble() {
            const container = document.getElementById('messagesContainer');
            const wrapper = document.createElement('div');
            wrapper.className = 'space-y-3';
            
            const bubble = document.createElement('div');
            bubble.className = 'flex';
            bubble.innerHTML = `
                <div class="flex-1">
                    <div class="text-gray-700 leading-relaxed" id="currentText"></div>
                </div>
            `;
            wrapper.appendChild(bubble);
            
            const productsDiv = document.createElement('div');
            productsDiv.className = 'grid grid-cols-1 md:grid-cols-2 gap-3 mt-4';
            productsDiv.id = 'currentProducts';
            wrapper.appendChild(productsDiv);
            
            const suggestionsDiv = document.createElement('div');
            suggestionsDiv.className = 'flex flex-wrap gap-2 mt-3';
            suggestionsDiv.id = 'currentSuggestions';
            wrapper.appendChild(suggestionsDiv);
            
            container.appendChild(wrapper);
            
            currentAssistantBubble = bubble.querySelector('#currentText');
            currentProductsContainer = productsDiv;
            
            scrollToBottom();
            return { textEl: currentAssistantBubble, productsEl: productsDiv, suggestionsEl: suggestionsDiv };
        }

        async function sendMessage(text) {
            conversationHistory.push({ role: 'user', content: text });
            document.getElementById('followUpInput').value = '';
            
            addUserBubble(text);
            const { textEl, productsEl, suggestionsEl } = addAssistantBubble();
            
            let collectedText = '';
            let products = null;
            
            textEl.innerHTML = '<span class="streaming-cursor animate-pulse">|</span>';
            
            try {
                const res = await fetch('/api/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: conversationHistory, language: 'pt-BR' })
                });
                
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                
                                if (data.type === 'text') {
                                    collectedText += data.content;
                                    textEl.innerHTML = formatText(collectedText) + '<span class="streaming-cursor animate-pulse">|</span>';
                                    scrollToBottom();
                                } else if (data.type === 'searching') {
                                    textEl.innerHTML = formatText(collectedText) + 
                                        '<div class="mt-3 flex items-center gap-2 text-gray-400 text-sm"><svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg> Pesquisando produtos...</div>';
                                    scrollToBottom();
                                } else if (data.type === 'products') {
                                    products = data.content;
                                } else if (data.type === 'done') {
                                    conversationHistory.push({ role: 'assistant', content: collectedText });
                                    textEl.innerHTML = formatText(collectedText);
                                    if (products && products.length > 0) {
                                        renderProducts(productsEl, products);
                                    }
                                    renderSuggestions(suggestionsEl);
                                    scrollToBottom();
                                } else if (data.type === 'error') {
                                    textEl.innerHTML = `<span class="text-red-500">${data.content}</span>`;
                                }
                            } catch (e) {}
                        }
                    }
                }
            } catch (err) {
                textEl.innerHTML = '<span class="text-red-500">Erro de conexão. Tente novamente.</span>';
            }
        }

        function renderProducts(container, products) {
            container.innerHTML = products.slice(0, 4).map((p, i) => {
                const link = p.buy_links?.[0];
                const price = p.price?.match?.(/R\$[\d.,\s]+/)?.[0] || p.price || 'Ver preço';
                const hasImg = p.image_url && !p.image_url.includes('logo');
                
                return `
                    <div class="product-card bg-white rounded-xl overflow-hidden border border-gray-100 shadow-sm">
                        <div class="relative">
                            ${i === 0 ? '<span class="absolute top-2 left-2 bg-primary text-white text-[10px] px-2 py-0.5 rounded-full font-medium">⭐ MELHOR</span>' : ''}
                            <div class="h-32 bg-gray-50 flex items-center justify-center p-3">
                                ${hasImg 
                                    ? `<img src="${p.image_url}" alt="${p.name}" class="max-h-full max-w-full object-contain" onerror="this.outerHTML='<span class=\\'text-4xl\\'>${getEmoji(p.name)}</span>'">`
                                    : `<span class="text-4xl">${getEmoji(p.name)}</span>`}
                            </div>
                        </div>
                        <div class="p-3">
                            <p class="text-[10px] text-gray-400 uppercase">${link?.store || ''}</p>
                            <h4 class="text-sm font-medium text-gray-900 line-clamp-2 mb-1">${p.name}</h4>
                            <p class="text-base font-bold text-gray-900">${price}</p>
                            ${link ? `<a href="${link.url}" target="_blank" class="mt-2 block w-full bg-gray-900 hover:bg-gray-800 text-white text-center py-2 rounded-lg text-xs font-medium transition">Ver na ${link.store}</a>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderSuggestions(container) {
            const suggestions = ['Qual é o melhor?', 'Tem opção mais barata?', 'Qual você recomenda?'];
            container.innerHTML = suggestions.map(s => 
                `<button onclick="sendMessage('${s}')" class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 rounded-full text-xs text-gray-600 transition">${s}</button>`
            ).join('');
        }

        function formatText(text) {
            return text
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        }

        function scrollToBottom() {
            requestAnimationFrame(() => {
                const chat = document.getElementById('chatMessages');
                chat.scrollTop = chat.scrollHeight;
            });
        }

        function getEmoji(name) {
            const n = name.toLowerCase();
            if (n.includes('fone') || n.includes('buds') || n.includes('headphone') || n.includes('airpod')) return '🎧';
            if (n.includes('monitor')) return '🖥️';
