<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Shopper AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #fef2f2 0%, #fff 50%, #fef2f2 100%); }
        .product-card { transition: all 0.2s ease; }
        .product-card:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .typing { animation: typing 1s infinite; }
        @keyframes typing { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        .chat-bubble { animation: bubbleIn 0.3s ease-out; }
        @keyframes bubbleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .markdown a { color: #dc2626; text-decoration: underline; }
        .markdown strong { font-weight: 600; }
        .markdown ul { list-style: disc; margin-left: 1.5rem; }
        .markdown li { margin-bottom: 0.25rem; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white border-b border-gray-100 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" onclick="goHome(event)" class="flex items-center gap-2">
                <span class="text-2xl">🛒</span>
                <span class="font-bold text-xl text-gray-900">PersonalShopper</span>
            </a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 pb-32">
        <!-- Hero Section -->
        <section id="heroSection" class="py-16 text-center">
            <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-4">
                Seu assistente de<br><span class="text-red-500">compras com IA</span>
            </h1>
            <p class="text-gray-500 mb-8 max-w-md mx-auto">
                Pergunte sobre qualquer produto e receba recomendações personalizadas
            </p>
            
            <form id="heroForm" class="max-w-2xl mx-auto mb-6">
                <div class="flex items-center bg-white rounded-2xl border border-gray-200 p-2 shadow-lg focus-within:border-red-300 focus-within:ring-2 focus-within:ring-red-100">
                    <span class="pl-3 text-gray-400 text-xl">🔍</span>
                    <input type="text" id="heroInput" placeholder="O que você está procurando?" class="flex-1 bg-transparent px-4 py-3 outline-none text-gray-700 text-lg" autocomplete="off">
                    <button type="submit" class="bg-red-500 hover:bg-red-600 text-white px-6 py-3 rounded-xl font-semibold transition">Buscar</button>
                </div>
            </form>

            <div class="flex flex-wrap justify-center gap-2">
                <button onclick="askQuestion('Quero um fone bluetooth bom até 500 reais')" class="px-4 py-2 bg-white hover:bg-gray-50 rounded-full text-sm text-gray-600 border border-gray-200 transition">🎧 Fone bluetooth</button>
                <button onclick="askQuestion('Melhor monitor 27 polegadas para programar')" class="px-4 py-2 bg-white hover:bg-gray-50 rounded-full text-sm text-gray-600 border border-gray-200 transition">🖥️ Monitor</button>
                <button onclick="askQuestion('Notebook custo-benefício para trabalho')" class="px-4 py-2 bg-white hover:bg-gray-50 rounded-full text-sm text-gray-600 border border-gray-200 transition">💻 Notebook</button>
            </div>
        </section>

        <!-- Chat Section -->
        <section id="chatSection" class="hidden">
            <div id="chatMessages" class="space-y-6 py-6"></div>
        </section>
    </main>

    <!-- Fixed Input -->
    <div id="chatInputArea" class="hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4">
        <form id="chatForm" class="max-w-4xl mx-auto flex gap-3">
            <input type="text" id="chatInput" placeholder="Pergunte mais sobre os produtos..." class="flex-1 px-4 py-3 bg-gray-100 rounded-xl border-0 focus:ring-2 focus:ring-red-500 focus:bg-white transition" autocomplete="off">
            <button type="submit" class="bg-red-500 hover:bg-red-600 text-white px-6 py-3 rounded-xl font-medium transition">Enviar</button>
        </form>
        <div class="max-w-4xl mx-auto mt-2">
            <button onclick="goHome()" class="text-sm text-gray-500 hover:text-gray-700">← Nova busca</button>
        </div>
    </div>

    <script>
        let conversationHistory = [];
        let currentProducts = [];

        function goHome(e) {
            if (e) e.preventDefault();
            document.getElementById('heroSection').classList.remove('hidden');
            document.getElementById('chatSection').classList.add('hidden');
            document.getElementById('chatInputArea').classList.add('hidden');
            document.getElementById('chatMessages').innerHTML = '';
            document.getElementById('heroInput').value = '';
            document.getElementById('heroInput').focus();
            conversationHistory = [];
            currentProducts = [];
        }

        function askQuestion(q) {
            document.getElementById('heroInput').value = q;
            document.getElementById('heroForm').dispatchEvent(new Event('submit'));
        }

        function addUserMessage(text) {
            const div = document.createElement('div');
            div.className = 'chat-bubble flex justify-end';
            div.innerHTML = `<div class="bg-red-500 text-white px-4 py-3 rounded-2xl rounded-br-sm max-w-[80%]">${text}</div>`;
            document.getElementById('chatMessages').appendChild(div);
            scrollToBottom();
        }

        function addAssistantMessage(html) {
            const div = document.createElement('div');
            div.className = 'chat-bubble';
            div.innerHTML = `
                <div class="flex gap-3">
                    <div class="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center flex-shrink-0 mt-1">🛒</div>
                    <div class="flex-1 bg-white rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm border border-gray-100 markdown">${html}</div>
                </div>
            `;
            document.getElementById('chatMessages').appendChild(div);
            scrollToBottom();
        }

        function addTyping() {
            const div = document.createElement('div');
            div.id = 'typingIndicator';
            div.className = 'chat-bubble';
            div.innerHTML = `
                <div class="flex gap-3">
                    <div class="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center flex-shrink-0">🛒</div>
                    <div class="bg-white rounded-2xl px-4 py-3 shadow-sm border border-gray-100">
                        <div class="flex gap-1">
                            <span class="w-2 h-2 bg-gray-400 rounded-full typing"></span>
                            <span class="w-2 h-2 bg-gray-400 rounded-full typing" style="animation-delay:0.2s"></span>
                            <span class="w-2 h-2 bg-gray-400 rounded-full typing" style="animation-delay:0.4s"></span>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('chatMessages').appendChild(div);
            scrollToBottom();
        }

        function removeTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        function scrollToBottom() {
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function getEmoji(name) {
            const n = name.toLowerCase();
            if (n.includes('fone') || n.includes('headphone') || n.includes('buds')) return '🎧';
            if (n.includes('monitor')) return '🖥️';
            if (n.includes('notebook')) return '💻';
            if (n.includes('teclado')) return '⌨️';
            if (n.includes('mouse')) return '🖱️';
            if (n.includes('cadeira')) return '🪑';
            if (n.includes('watch')) return '⌚';
            if (n.includes('phone') || n.includes('celular')) return '📱';
            return '📦';
        }

        function renderProductCards(products) {
            if (!products || products.length === 0) return '';
            
            const colors = ['bg-blue-50', 'bg-pink-50', 'bg-purple-50', 'bg-green-50', 'bg-amber-50'];
            
            return `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4">
                    ${products.map((p, i) => {
                        const link = p.buy_links?.[0];
                        const review = p.review_videos?.[0];
                        const hasImage = p.image_url && !p.image_url.includes('logo');
                        const price = p.price_range?.match(/R\$[\d.,\s]+/)?.[0] || p.price_range || 'Ver preço';
                        
                        return `
                        <div class="product-card bg-white rounded-xl overflow-hidden border border-gray-100 shadow-sm">
                            <div class="${colors[i % colors.length]} p-3 flex items-center justify-center h-32 relative">
                                ${i === 0 ? '<span class="absolute top-2 left-2 bg-green-500 text-white text-xs px-2 py-0.5 rounded-full">⭐ Top</span>' : ''}
                                ${hasImage 
                                    ? `<img src="${p.image_url}" alt="${p.name}" class="max-h-24 object-contain" onerror="this.outerHTML='<span class=\\'text-4xl\\'>${getEmoji(p.name)}</span>'">`
                                    : `<span class="text-4xl">${getEmoji(p.name)}</span>`
                                }
                            </div>
                            <div class="p-3">
                                <p class="text-xs text-gray-500 mb-1">${link?.store || 'Loja'}</p>
                                <h4 class="font-semibold text-gray-900 text-sm leading-tight mb-1 line-clamp-2">${p.name}</h4>
                                <p class="font-bold text-gray-900 mb-2">${price}</p>
                                <div class="flex gap-2">
                                    ${link ? `<a href="${link.url}" target="_blank" class="flex-1 bg-red-500 hover:bg-red-600 text-white text-center py-2 rounded-lg text-sm font-medium transition">Comprar</a>` : ''}
                                    ${review ? `<a href="${review.url}" target="_blank" class="bg-gray-100 hover:bg-gray-200 py-2 px-3 rounded-lg text-sm transition" title="Review">▶️</a>` : ''}
                                </div>
                            </div>
                        </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        async function sendMessage(message, isInitial = false) {
            // Show chat UI
            document.getElementById('heroSection').classList.add('hidden');
            document.getElementById('chatSection').classList.remove('hidden');
            document.getElementById('chatInputArea').classList.remove('hidden');

            // Add user message
            addUserMessage(message);
            conversationHistory.push({ role: 'user', content: message });

            // Show typing
            addTyping();

            try {
                // First, do a product search
                const searchResponse = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: message, language: 'pt-BR', country: 'BR' })
                });

                removeTyping();

                if (searchResponse.ok) {
                    const searchData = await searchResponse.json();
                    currentProducts = searchData.recommendations;

                    // Generate AI response about the products
                    const productsSummary = currentProducts.map((p, i) => 
                        `${i + 1}. **${p.name}** - ${p.price_range || 'Ver preço'}`
                    ).join('\n');

                    let aiResponse = `Encontrei **${currentProducts.length} opções** pra você! 🎯\n\n`;
                    
                    if (currentProducts.length > 0) {
                        const top = currentProducts[0];
                        aiResponse += `Minha recomendação é o **${top.name}**`;
                        if (top.price_range) aiResponse += ` por ${top.price_range}`;
                        aiResponse += `. `;
                        
                        if (currentProducts.length > 1) {
                            aiResponse += `Mas também tem boas opções como ${currentProducts[1].name}`;
                            if (currentProducts.length > 2) aiResponse += ` e ${currentProducts[2].name}`;
                            aiResponse += `.`;
                        }
                        
                        aiResponse += `\n\nQuer saber mais sobre algum específico? Posso comparar ou detalhar qualquer um!`;
                    }

                    // Convert markdown to HTML
                    const htmlResponse = aiResponse
                        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                        .replace(/\n/g, '<br>');

                    addAssistantMessage(htmlResponse + renderProductCards(currentProducts));
                    conversationHistory.push({ role: 'assistant', content: aiResponse });
                } else {
                    const errorData = await searchResponse.json();
                    addAssistantMessage(`Hmm, não encontrei produtos para essa busca. 😕<br><br>Tenta descrever de outro jeito? Por exemplo: "fone bluetooth bom e barato" ou "monitor grande para trabalhar".`);
                }

            } catch (error) {
                removeTyping();
                addAssistantMessage(`Ops, tive um problema técnico. 😅 Tenta de novo?`);
            }

            document.getElementById('chatInput').focus();
        }

        // Hero form submit
        document.getElementById('heroForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('heroInput');
            if (input.value.trim()) {
                sendMessage(input.value.trim(), true);
            }
        });

        // Chat form submit
        document.getElementById('chatForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('chatInput');
            if (input.value.trim()) {
                sendMessage(input.value.trim());
                input.value = '';
            }
        });

        document.getElementById('heroInput').focus();
    </script>
</body>
</html>
