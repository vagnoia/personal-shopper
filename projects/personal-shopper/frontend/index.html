<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Shopper AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .search-btn { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        .search-btn:hover { background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%); }
        .tag:hover { background-color: #f3f4f6; }
        .product-card { transition: transform 0.2s, box-shadow 0.2s; }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.1); }
        .loading { display: none; }
        .loading.active { display: flex; }
        .chat-message { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .prose a { color: #dc2626; text-decoration: underline; }
    </style>
</head>
<body class="bg-white min-h-screen">
    <!-- Header -->
    <header class="border-b border-gray-100">
        <div class="container mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🛒</span>
                <span class="font-bold text-xl">PersonalShopper</span>
            </div>
            <nav class="hidden md:flex items-center gap-6 text-sm text-gray-600">
                <a href="#como-funciona" class="hover:text-gray-900">Como funciona</a>
                <a href="#sobre" class="hover:text-gray-900">Sobre</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main id="main-content">
        <!-- Hero Section -->
        <section id="hero-section" class="py-16 md:py-24">
            <div class="container mx-auto px-4 text-center">
                <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-4">
                    Descubra sua próxima<br>
                    <span class="text-red-500">melhor compra com IA</span>
                </h1>
                <p class="text-gray-500 mb-8 max-w-md mx-auto">
                    Descreva o que você precisa e a IA encontra as melhores opções com preços e links
                </p>
                
                <!-- Search Box -->
                <form id="searchForm" class="max-w-2xl mx-auto mb-8">
                    <div class="flex items-center bg-gray-50 rounded-full border border-gray-200 p-2 focus-within:border-red-300 focus-within:ring-2 focus-within:ring-red-100">
                        <span class="pl-4 text-gray-400">🔍</span>
                        <input 
                            type="text" 
                            id="query" 
                            placeholder="fone tipo airpod até 1000 reais" 
                            class="flex-1 bg-transparent px-4 py-3 outline-none text-gray-700"
                            required
                        >
                        <button type="submit" class="search-btn text-white px-6 py-3 rounded-full font-medium">
                            Buscar
                        </button>
                    </div>
                </form>

                <!-- Popular Searches -->
                <div class="mb-12">
                    <p class="text-xs text-gray-400 uppercase tracking-wide mb-3">Buscas populares</p>
                    <div class="flex flex-wrap justify-center gap-2">
                        <button onclick="searchTag('Notebook gamer barato')" class="tag px-4 py-2 bg-gray-50 rounded-full text-sm text-gray-600 border border-gray-200 hover:border-gray-300">
                            Notebook gamer barato
                        </button>
                        <button onclick="searchTag('Fone bluetooth até 200')" class="tag px-4 py-2 bg-gray-50 rounded-full text-sm text-gray-600 border border-gray-200 hover:border-gray-300">
                            Fone bluetooth até 200
                        </button>
                        <button onclick="searchTag('Smartwatch com GPS')" class="tag px-4 py-2 bg-gray-50 rounded-full text-sm text-gray-600 border border-gray-200 hover:border-gray-300">
                            Smartwatch com GPS
                        </button>
                        <button onclick="searchTag('Cadeira ergonômica home office')" class="tag px-4 py-2 bg-gray-50 rounded-full text-sm text-gray-600 border border-gray-200 hover:border-gray-300">
                            Cadeira ergonômica
                        </button>
                    </div>
                </div>

                <!-- Product Grid Inspiration -->
                <div class="grid grid-cols-4 md:grid-cols-6 gap-4 max-w-4xl mx-auto opacity-60">
                    <div class="aspect-square bg-gray-100 rounded-2xl"></div>
                    <div class="aspect-square bg-gray-100 rounded-2xl"></div>
                    <div class="aspect-square bg-gray-100 rounded-2xl"></div>
                    <div class="aspect-square bg-gray-100 rounded-2xl"></div>
                    <div class="aspect-square bg-gray-100 rounded-2xl hidden md:block"></div>
                    <div class="aspect-square bg-gray-100 rounded-2xl hidden md:block"></div>
                </div>
            </div>
        </section>

        <!-- Loading -->
        <div id="loading" class="loading fixed inset-0 bg-white bg-opacity-90 items-center justify-center z-50">
            <div class="text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-4 border-red-500 border-t-transparent mx-auto mb-4"></div>
                <p class="text-gray-600">Buscando as melhores opções...</p>
                <p class="text-sm text-gray-400 mt-2">Analisando preços e avaliações com IA</p>
            </div>
        </div>

        <!-- Results Section (Chat-like) -->
        <section id="results-section" class="hidden py-8">
            <div class="container mx-auto px-4 max-w-4xl">
                <!-- Chat Container -->
                <div id="chat-container" class="space-y-6">
                    <!-- Messages will be inserted here -->
                </div>

                <!-- Follow-up Input -->
                <div class="sticky bottom-4 mt-8">
                    <form id="followUpForm" class="flex items-center bg-white rounded-full border border-gray-200 p-2 shadow-lg">
                        <input 
                            type="text" 
                            id="followUpQuery" 
                            placeholder="Pergunte mais sobre os produtos..." 
                            class="flex-1 bg-transparent px-4 py-3 outline-none text-gray-700"
                        >
                        <button type="submit" class="search-btn text-white px-6 py-3 rounded-full font-medium">
                            Enviar
                        </button>
                    </form>
                    <button onclick="newSearch()" class="mt-4 text-sm text-gray-500 hover:text-gray-700 mx-auto block">
                        ← Nova busca
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-100 py-8 mt-16">
        <div class="container mx-auto px-4 text-center text-sm text-gray-400">
            <p>PersonalShopper AI © 2026</p>
        </div>
    </footer>

    <script>
        const API_URL = '';
        let conversationHistory = [];

        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = document.getElementById('query').value.trim();
            if (!query) return;
            await performSearch(query);
        });

        document.getElementById('followUpForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = document.getElementById('followUpQuery').value.trim();
            if (!query) return;
            document.getElementById('followUpQuery').value = '';
            addUserMessage(query);
            await performSearch(query);
        });

        function searchTag(query) {
            document.getElementById('query').value = query;
            performSearch(query);
        }

        function newSearch() {
            document.getElementById('hero-section').classList.remove('hidden');
            document.getElementById('results-section').classList.add('hidden');
            document.getElementById('chat-container').innerHTML = '';
            document.getElementById('query').value = '';
            conversationHistory = [];
        }

        function addUserMessage(text) {
            const container = document.getElementById('chat-container');
            container.innerHTML += `
                <div class="chat-message flex justify-end">
                    <div class="bg-red-500 text-white px-4 py-3 rounded-2xl rounded-br-md max-w-md">
                        ${text}
                    </div>
                </div>
            `;
        }

        function addAIMessage(html) {
            const container = document.getElementById('chat-container');
            container.innerHTML += `
                <div class="chat-message">
                    <div class="bg-gray-100 px-4 py-3 rounded-2xl rounded-bl-md max-w-3xl">
                        ${html}
                    </div>
                </div>
            `;
        }

        async function performSearch(query) {
            const loading = document.getElementById('loading');
            loading.classList.add('active');

            // Hide hero, show results
            document.getElementById('hero-section').classList.add('hidden');
            document.getElementById('results-section').classList.remove('hidden');

            // Add user message if it's the first search
            if (conversationHistory.length === 0) {
                addUserMessage(query);
            }

            try {
                const response = await fetch(`${API_URL}/api/search`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: query,
                        language: 'pt-BR',
                        country: 'BR'
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Erro na busca');
                }

                conversationHistory.push({ query, results: data });
                displayResults(data);

            } catch (error) {
                addAIMessage(`<p class="text-red-500">Erro: ${error.message}</p>`);
            } finally {
                loading.classList.remove('active');
            }
        }

        function displayResults(data) {
            let html = `<p class="text-gray-600 mb-4">Encontrei <strong>${data.recommendations.length} opções</strong> para você:</p>`;
            
            html += '<div class="space-y-4">';
            
            data.recommendations.forEach((rec, i) => {
                const buyLink = rec.buy_links[0];
                html += `
                    <div class="product-card bg-white border border-gray-200 rounded-xl p-4 hover:border-red-200">
                        <div class="flex items-start gap-4">
                            <div class="w-16 h-16 bg-gray-100 rounded-lg flex-shrink-0 flex items-center justify-center text-2xl">
                                ${getProductEmoji(rec.name)}
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-start justify-between gap-2">
                                    <h3 class="font-semibold text-gray-900">${rec.name}</h3>
                                    <span class="text-red-500 font-bold whitespace-nowrap">${rec.price_range}</span>
                                </div>
                                <p class="text-sm text-gray-500 mt-1">${rec.description}</p>
                                <div class="flex flex-wrap gap-2 mt-2">
                                    ${rec.pros.slice(0, 3).map(p => `<span class="text-xs bg-green-50 text-green-700 px-2 py-1 rounded">✓ ${p}</span>`).join('')}
                                </div>
                                ${buyLink ? `
                                    <a href="${buyLink.url}" target="_blank" class="inline-flex items-center gap-1 mt-3 text-sm text-red-500 hover:text-red-600 font-medium">
                                        Comprar em ${buyLink.store} →
                                    </a>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            html += `<p class="text-xs text-gray-400 mt-4">Busca realizada em ${(data.search_time_ms/1000).toFixed(1)}s</p>`;
            
            addAIMessage(html);
            
            // Scroll to bottom
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function getProductEmoji(name) {
            const n = name.toLowerCase();
            if (n.includes('fone') || n.includes('headphone') || n.includes('airpod')) return '🎧';
            if (n.includes('monitor') || n.includes('tela')) return '🖥️';
            if (n.includes('notebook') || n.includes('laptop')) return '💻';
            if (n.includes('teclado') || n.includes('keyboard')) return '⌨️';
            if (n.includes('mouse')) return '🖱️';
            if (n.includes('cadeira') || n.includes('chair')) return '🪑';
            if (n.includes('smartwatch') || n.includes('relógio')) return '⌚';
            if (n.includes('tênis') || n.includes('sapato')) return '👟';
            if (n.includes('celular') || n.includes('phone') || n.includes('iphone')) return '📱';
            if (n.includes('câmera') || n.includes('camera')) return '📷';
            if (n.includes('tablet') || n.includes('ipad')) return '📱';
            return '📦';
        }
    </script>
</body>
</html>
